<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">乐队唱片封面 — 26 张 AI 意境风专辑封面</title>
  <desc id="desc">暖纸底标题：乐队唱片封面，一队一张，大师摄影式的意境封面；右侧是一张黑胶唱片从黑色封套里滑出一半。</desc>

  <rect width="1200" height="360" rx="26" fill="#f2ecdf"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5f574a">BAND COVER PROJECT · AI 意境风</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c1a16">乐队唱片封面</text>
    <text x="56" y="168" font-size="23" fill="#3a352c">一队一张，大师摄影式的意境封面</text>
    <text x="56" y="204" font-size="19" fill="#5f574a">《乐队的夏天》三季 + 6 支大牌乐队，共 26 张。</text>
    <g id="chips" font-size="18" fill="#1c1a16" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#e8e0cf" stroke="#d8cfb8" stroke-width="1.5"/><text x="119" y="262">26 张封面</text></g>
      <g><rect x="194" y="238" width="110" height="36" rx="18" fill="#e8e0cf" stroke="#d8cfb8" stroke-width="1.5"/><text x="249" y="262">4 个分组</text></g>
      <g><rect x="316" y="238" width="126" height="36" rx="18" fill="#e8e0cf" stroke="#d8cfb8" stroke-width="1.5"/><text x="379" y="262">WebP 原图</text></g>
      <g><rect x="454" y="238" width="100" height="36" rx="18" fill="#e8e0cf" stroke="#d8cfb8" stroke-width="1.5"/><text x="504" y="262">可下载</text></g>
    </g>
    <text x="56" y="316" font-size="17" fill="#5f574a">含蓄，不直白 · 点封面看大图</text>
  </g>

  <text id="vinyl-caption" x="965" y="344" font-size="18" fill="#5f574a" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">一队一张 · 含蓄，不直白</text>

  <g id="vinyl">
    <!-- 光束 -->
    <polygon points="1000,0 1120,0 1082,58 1038,58" fill="#e5d5a1" opacity="0.55"/>
    <!-- 封套 -->
    <rect x="800" y="58" width="250" height="250" rx="8" fill="#1c1a16"/>
    <rect x="800" y="58" width="250" height="250" rx="8" fill="none" stroke="#3a352c" stroke-width="2"/>
    <text x="824" y="96" font-size="19" fill="#f2ecdf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">乐队唱片封面</text>
    <text x="824" y="122" font-size="16" fill="#a89a7a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">26 COVERS</text>
    <!-- 黑胶（滑出一半） -->
    <g>
      <circle cx="1062" cy="183" r="112" fill="#111111"/>
      <circle cx="1062" cy="183" r="112" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
      <circle cx="1062" cy="183" r="96" fill="none" stroke="#262626" stroke-width="1"/>
      <circle cx="1062" cy="183" r="80" fill="none" stroke="#262626" stroke-width="1"/>
      <circle cx="1062" cy="183" r="64" fill="none" stroke="#262626" stroke-width="1"/>
      <circle cx="1062" cy="183" r="48" fill="none" stroke="#262626" stroke-width="1"/>
      <circle cx="1062" cy="183" r="36" fill="#c2571f"/>
      <circle cx="1062" cy="183" r="36" fill="none" stroke="#8f3a12" stroke-width="1.5"/>
      <circle cx="1062" cy="183" r="6" fill="#f2ecdf"/>
      <path d="M 990 120 A 100 100 0 0 1 1040 82" fill="none" stroke="#3d3d3d" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
